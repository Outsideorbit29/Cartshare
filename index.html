<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartShare — Stack the cart. Share the cost.</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <div class="landing-wrapper">
    <div class="landing-card">
      <!-- Brand Header -->
      <div class="landing-brand">
        <span class="brand-icon">🛒</span>
        <h1>CartShare</h1>
        <p class="tagline">Stack the cart. Share the cost.</p>
      </div>

      <!-- Body -->
      <div class="landing-body">
        <!-- Username -->
        <div class="mb-4">
          <label for="userName" class="form-label">Your Name</label>
          <input type="text" class="form-control form-control-lg" id="userName"
                 placeholder="Enter your name..." maxlength="30"
                 autocomplete="name" style="font-size:1.1rem;">
        </div>

        <!-- Create / Join Tabs -->
        <ul class="nav nav-pills room-tabs mb-3" id="roomTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="create-tab" data-bs-toggle="pill"
                    data-bs-target="#create" type="button" role="tab">
              <i class="fas fa-plus-circle"></i> Create Room
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="join-tab" data-bs-toggle="pill"
                    data-bs-target="#join" type="button" role="tab">
              <i class="fas fa-sign-in-alt"></i> Join Room
            </button>
          </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
          <!-- Create Room -->
          <div class="tab-pane fade show active" id="create" role="tabpanel">
            <p style="font-size:0.875rem; color:var(--cs-muted); margin-bottom:1rem;">
              Create a new shared cart room and invite others with the room code.
            </p>
            <div class="d-grid">
              <button class="btn btn-accent btn-lg" id="createRoomBtn">
                <i class="fas fa-plus-circle me-2"></i> Create a Room
              </button>
            </div>
          </div>

          <!-- Join Room -->
          <div class="tab-pane fade" id="join" role="tabpanel">
            <p style="font-size:0.875rem; color:var(--cs-muted); margin-bottom:1rem;">
              Enter the 6-character room code shared by a friend.
            </p>
            <div class="mb-3">
              <label for="joinRoomCode" class="form-label">Room Code</label>
              <input type="text" class="form-control form-control-lg" id="joinRoomCode"
                     placeholder="e.g. ABC123" maxlength="6"
                     style="text-transform:uppercase; font-family:var(--cs-font-mono); font-size:1.3rem; letter-spacing:0.15em; text-align:center;">
            </div>
            <div class="d-grid">
              <button class="btn btn-primary btn-lg" id="joinRoomBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Join Room
              </button>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <p class="text-center mt-4" style="font-size:0.8rem; color:var(--cs-muted); margin-bottom:0;">
          <i class="fas fa-users me-1"></i> Dorm rooms · Office teams · Travel groups
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/room.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
