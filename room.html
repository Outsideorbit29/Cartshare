<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartShare — Room</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Print Styles -->
  <link rel="stylesheet" href="css/print.css">
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="room-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col">
          <a href="index.html" class="brand-small">
            <span class="d-none d-sm-inline">🛒 CartShare</span>
            <span class="d-sm-none">🛒</span>
          </a>
        </div>
        <div class="col-auto">
          <div class="d-flex align-items-center gap-2 flex-wrap header-actions">
            <!-- Room Code Badge -->
            <div class="room-code-badge" title="Click to copy room code" role="button">
              <span class="pulse-dot"></span>
              <span id="roomCode">------</span>
              <i class="far fa-copy" style="font-size:0.75rem; opacity:0.7;"></i>
            </div>

            <!-- User Display -->
            <div class="user-pill" id="currentUser">
              <span class="avatar">?</span>
              Loading...
            </div>

            <!-- User Count -->
            <span style="font-size:0.8125rem; color:var(--cs-muted);" id="userCount">0 users</span>

            <!-- Actions -->
            <div class="dropdown">
              <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-ellipsis-h"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" id="clearCartBtn"><i class="fas fa-trash-alt me-2" style="color:var(--cs-danger);"></i> Clear Cart</button></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" id="leaveRoomBtn"><i class="fas fa-sign-out-alt me-2"></i> Leave Room</button></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <!-- Participants row -->
      <div class="row mt-2" id="userListRow">
        <div class="col">
          <div class="d-flex gap-1 flex-wrap align-items-center" id="userList">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="py-4">
    <div class="container">
      <div class="row g-4">
        <!-- Left: Cart Section -->
        <div class="col-lg-8">
          <div class="cart-section">
            <div class="section-header">
              <h2><i class="fas fa-shopping-cart me-2" style="color:var(--cs-primary);"></i> Shared Cart</h2>
              <button class="btn btn-outline-primary btn-sm" id="receiptBtn">
                <i class="fas fa-receipt me-1"></i> Receipt
              </button>
            </div>

            <!-- Product Catalog -->
            <div id="catalogContainer" class="no-print" style="padding: 1rem 1.5rem 0.5rem; border-bottom: 1px solid var(--cs-border);">
              <!-- Rendered by js/catalog.js -->
            </div>

            <!-- Add Item Form -->
            <div class="add-item-area no-print">
              <form id="addItemForm" class="row g-2 align-items-end">
                <div class="col-md-5">
                  <label for="itemName" class="form-label">Item</label>
                  <input type="text" class="form-control" id="itemName" placeholder="e.g. Pizza" maxlength="60" autocomplete="off">
                </div>
                <div class="col-md-3">
                  <label for="itemPrice" class="form-label">Price (₹)</label>
                  <div class="input-group">
                    <span class="input-group-text">₹</span>
                    <input type="number" class="form-control" id="itemPrice" placeholder="0.00" step="0.01" min="0.01">
                  </div>
                </div>
                <div class="col-md-2">
                  <label for="itemQuantity" class="form-label">Qty</label>
                  <input type="number" class="form-control" id="itemQuantity" value="1" min="1" max="999">
                </div>
                <div class="col-md-2">
                  <button type="submit" class="btn btn-accent w-100">
                    <i class="fas fa-plus me-1"></i> Add
                  </button>
                </div>
              </form>
            </div>

            <!-- Cart Items Table -->
            <div class="table-responsive">
              <table class="table cart-table">
                <thead>
                  <tr>
                    <th style="width:35%;">Item</th>
                    <th style="width:15%;">Price</th>
                    <th style="width:20%;">Qty</th>
                    <th style="width:15%;" class="text-end">Total</th>
                    <th style="width:15%;"></th>
                  </tr>
                </thead>
                <tbody id="cartItems">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>

            <!-- Summary -->
            <div class="cart-summary" id="cartSummary">
              <span>
                <span class="summary-label">Items:</span>
                <span class="summary-value" style="font-size:1rem;">0</span>
              </span>
              <span>
                <span class="summary-label">Total:</span>
                <span class="summary-value">$0.00</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Right: Activity Log -->
        <div class="col-lg-4">
          <div class="activity-section">
            <div class="section-header">
              <h2><i class="fas fa-bolt me-2" style="color:var(--cs-warm);"></i> Activity</h2>
            </div>
            <div class="activity-feed" id="activityFeed">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ====== RECEIPT MODAL ====== -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-labelledby="receiptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--cs-radius);">
        <div class="modal-header" style="border-bottom:1px solid var(--cs-border);">
          <h5 class="modal-title" id="receiptModalLabel">
            <i class="fas fa-receipt me-2" style="color:var(--cs-primary);"></i> Receipt
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="receiptContent">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--cs-border);">
          <button type="button" class="btn btn-primary" id="printReceiptBtn">
            <i class="fas fa-print me-1"></i> Print
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden receipt print area -->
  <div id="receiptPrintArea" class="receipt-print-area" style="display:none;"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/room.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
